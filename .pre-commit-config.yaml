repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff
        args: [--fix, --select, "F401,F811"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, yaml]

  - repo: local
    hooks:
      - id: validate-compose-env
        name: validate Compose environment contract
        entry: python scripts/validate_compose_env.py
        language: python
        pass_filenames: false
        files: ^(docker-compose\.yml|\.env\.example|scripts/validate_compose_env\.py)$
      - id: commitlint
        name: commitlint
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
